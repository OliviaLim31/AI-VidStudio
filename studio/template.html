<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Olivia 剪辑工作室</title>
<style id="fontfaces"></style>
<style>
  :root { --purple:#5b2ba8; --purple-2:#7c4ddb; --lav:#f3ecff; --lav-2:#e4d6ff; --ink:#24163d; --muted:#7a6c93; --line:#e6dcf7; --bg:#faf7ff; --pink:#ff3b7f; }
  * { box-sizing: border-box; }
  html, body { margin:0; background:var(--bg); color:var(--ink); font-family: "F-inter-sb", system-ui, -apple-system, sans-serif; font-size:14px; }
  button, select, input, textarea { font: inherit; color: inherit; }
  header { display:flex; align-items:center; gap:8px; padding:10px 14px; border-bottom:1px solid var(--line); background:#fff; position:sticky; top:0; z-index:30; flex-wrap:wrap; }
  header h1 { font-size:16px; margin:0; font-family:"F-display-black"; letter-spacing:-.01em; }
  .lenpill { font-size:12px; padding:3px 9px; border-radius:20px; background:#e8f7ee; color:#13794a; font-weight:700; }
  .lenpill.warn { background:#fff1e0; color:#a35a00; }
  .spacer { flex:1; }
  .btn { border:1px solid var(--line); background:#fff; border-radius:10px; padding:7px 12px; cursor:pointer; white-space:nowrap; }
  .btn:hover { border-color:var(--purple-2); }
  .btn.primary { background:var(--purple); color:#fff; border-color:var(--purple); }
  .btn.small { padding:4px 9px; font-size:12px; border-radius:8px; }
  .btn:disabled { opacity:.4; cursor:default; }
  main { display:grid; grid-template-columns:minmax(300px,420px) 1fr; gap:14px; padding:14px; max-width:1240px; margin:0 auto; }
  @media (max-width: 820px) { main { grid-template-columns:1fr; padding:8px; gap:10px; } .stage-wrap{order:1} .timeline-wrap{order:2} #inspectorPanel{order:3} }
  .panel { background:#fff; border:1px solid var(--line); border-radius:14px; padding:12px; min-width:0; }
  .stage-wrap { display:flex; flex-direction:column; align-items:center; gap:8px; }
  .stage { position:relative; width:min(100%, calc(66vh * 9 / 16)); aspect-ratio:9/16; background:#000; border-radius:16px; overflow:hidden; box-shadow:0 10px 30px rgba(60,20,110,.18); touch-action:none; user-select:none; -webkit-user-select:none; }
  .layer { position:absolute; inset:0; }
  .full video { position:absolute; object-fit:fill; display:block; transform-origin:center; }
  .full.lav { background:linear-gradient(#f6f0ff,#d6c4f5); } .full.black { background:#000; }
  .hguide { position:absolute; left:0; right:0; height:1px; top:50%; background:#ff3b7f; display:none; pointer-events:none; }
  .dirty-dot { display:inline-block; width:8px; height:8px; border-radius:50%; background:#ff9f1a; margin-left:4px; vertical-align:middle; }
  .savelist { display:flex; flex-direction:column; gap:6px; margin:10px 0; }
  .saveitem { display:flex; justify-content:space-between; align-items:center; gap:8px; border:1px solid var(--line); border-radius:10px; padding:8px 10px; }
  .dlrow { border:1px solid var(--line); border-radius:12px; padding:12px; margin:10px 0; }
  .phonebg { background:linear-gradient(#f6f0ff,#d6c4f5); }
  .phone { position:absolute; overflow:hidden; box-shadow:0 14px 40px rgba(60,20,110,.35); background:#fff; }
  .phone video { position:absolute; left:0; display:block; }
  .pill { position:absolute; white-space:pre; text-align:center; cursor:move; transform-origin:center center; font-synthesis:none; }
  .pill.sel { outline:2px dashed #ffcc00; outline-offset:4px; }
  .h-rot, .h-scale { position:absolute; width:22px; height:22px; border-radius:50%; background:#ffcc00; border:2px solid #fff; box-shadow:0 1px 4px rgba(0,0,0,.4); }
  .h-rot { left:50%; top:-40px; margin-left:-11px; cursor:grab; }
  .h-rot::after { content:""; position:absolute; left:9px; top:20px; width:2px; height:16px; background:#ffcc00; }
  .h-scale { right:-17px; bottom:-17px; cursor:nwse-resize; }
  .guide { position:absolute; top:0; bottom:0; width:1px; left:50%; background:#ff3b7f; display:none; pointer-events:none; }
  .safe { position:absolute; background:repeating-linear-gradient(45deg, rgba(255,59,127,.18) 0 8px, rgba(255,59,127,.06) 8px 16px); pointer-events:none; display:none; }
  .badge { position:absolute; color:rgba(255,255,255,.94); background:rgba(20,10,35,.47); white-space:nowrap; pointer-events:none; font-family:"F-inter-sb"; }
  .transport { display:flex; gap:6px; align-items:center; justify-content:center; flex-wrap:wrap; }
  .time { font-variant-numeric:tabular-nums; color:var(--muted); min-width:90px; text-align:center; font-weight:600; }
  .hint { color:var(--muted); font-size:12px; line-height:1.5; }
  .tabs { display:flex; gap:4px; background:var(--lav); padding:4px; border-radius:12px; margin-bottom:10px; }
  .tab { flex:1; text-align:center; padding:7px 4px; border-radius:9px; cursor:pointer; font-weight:700; color:var(--muted); border:0; background:transparent; }
  .tab.on { background:#fff; color:var(--purple); box-shadow:0 1px 4px rgba(60,20,110,.12); }
  .row { display:grid; grid-template-columns:92px 1fr; gap:8px; align-items:center; margin:7px 0; }
  .row > label { color:var(--muted); font-size:12px; font-weight:600; }
  .inline { display:flex; gap:8px; align-items:center; flex-wrap:wrap; }
  input[type=number] { width:72px; padding:5px 6px; border:1px solid var(--line); border-radius:8px; }
  input[type=text], select, textarea { padding:6px 8px; border:1px solid var(--line); border-radius:8px; background:#fff; max-width:100%; }
  input[type=color] { width:38px; height:30px; border:1px solid var(--line); border-radius:8px; padding:2px; background:#fff; }
  textarea { width:100%; resize:vertical; min-height:52px; }
  input[type=range] { flex:1; min-width:90px; accent-color:var(--purple); }
  h2 { font-size:15px; margin:0 0 4px; font-family:"F-display-black"; letter-spacing:-.01em; }
  h3 { font-size:13px; margin:14px 0 6px; color:var(--purple); font-family:"F-inter-xb"; }
  .card { border:1px solid var(--line); border-radius:12px; padding:10px; margin-top:8px; background:#fdfbff; }
  .card.sel { border-color:var(--purple-2); box-shadow:0 0 0 2px var(--lav-2); }
  .presets { display:flex; gap:6px; flex-wrap:wrap; }
  .preset { border:1px solid var(--line); border-radius:9px; padding:4px 9px; cursor:pointer; font-size:12px; white-space:nowrap; position:relative; }
  .preset .x { margin-left:6px; color:var(--muted); }
  .chk { display:inline-flex; gap:5px; align-items:center; font-size:13px; }
  /* timeline */
  .timeline-wrap { grid-column:1 / -1; }
  .tl-scroll { overflow-x:auto; overflow-y:hidden; border-radius:10px; background:var(--lav); -webkit-overflow-scrolling:touch; }
  .tl { position:relative; min-width:100%; }
  .ruler { position:relative; height:20px; border-bottom:1px solid #fff; cursor:pointer; }
  .tick { position:absolute; top:0; font-size:10px; color:var(--muted); padding-left:3px; border-left:1px solid #cdbdf0; height:100%; }
  .lane { position:relative; height:58px; border-bottom:1px solid #fff; }
  .lane.audio { height:40px; background:rgba(255,255,255,.35); }
  .lane-empty { position:absolute; left:8px; top:11px; font-size:11px; color:var(--muted); pointer-events:none; white-space:nowrap; }
  .lane-label { position:sticky; left:0; z-index:3; font-size:10px; color:var(--muted); padding:2px 5px; }
  .blk { position:absolute; top:4px; bottom:4px; border-radius:8px; padding:4px 10px; overflow:hidden; cursor:pointer; border:2px solid transparent; touch-action:none; }
  .blk .n { font-weight:700; font-size:12px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; display:block; }
  .blk .d { font-size:10px; color:var(--muted); }
  .blk.full { background:#d9c8fa; } .blk.phone { background:#ece3ff; } .blk.freeze { background:#c9b2f7; }
  .blk.voice { background:#ffd6e7; cursor:grab; } .blk.music { background:#cfeee0; cursor:grab; } .blk.missing { background:repeating-linear-gradient(45deg,#eee 0 6px,#ddd 6px 12px); }
  .blk.sel { border-color:var(--purple); }
  .trim { position:absolute; top:0; bottom:0; width:10px; background:rgba(91,43,168,.35); cursor:ew-resize; z-index:2; touch-action:none; }
  .trim.l { left:0; border-radius:6px 0 0 6px; } .trim.r { right:0; border-radius:0 6px 6px 0; }
  .trim::after { content:""; position:absolute; left:4px; top:30%; bottom:30%; width:2px; background:#fff; border-radius:2px; }
  .playhead { position:absolute; top:0; bottom:0; width:2px; background:var(--pink); pointer-events:none; z-index:5; }
  .tl-actions { display:flex; gap:6px; flex-wrap:wrap; margin-top:8px; align-items:center; }
  .toast { position:fixed; bottom:18px; left:50%; transform:translateX(-50%); background:var(--ink); color:#fff; padding:10px 16px; border-radius:12px; opacity:0; transition:opacity .2s; pointer-events:none; z-index:60; }
  .toast.on { opacity:1; }
  .modal { position:fixed; inset:0; background:rgba(20,10,40,.45); display:none; align-items:center; justify-content:center; z-index:50; padding:16px; }
  .modal.on { display:flex; }
  .modal .box { background:#fff; border-radius:16px; padding:18px; max-width:560px; width:100%; max-height:90vh; overflow:auto; }
  .modal textarea { min-height:180px; font-family:ui-monospace,monospace; font-size:11px; }
  .filebtn { position:relative; overflow:hidden; display:inline-block; }
  .filebtn input { position:absolute; inset:0; opacity:0; cursor:pointer; }
  .warn { color:#a35a00; font-size:12px; }
</style>
</head>
<body>
<header>
  <h1>🎬 Olivia 剪辑工作室</h1>
  <span class="lenpill" id="lenPill">0s</span>
  <span class="spacer"></span>
  <button class="btn" id="undoBtn">↶ 撤销</button>
  <button class="btn" id="resetBtn">还原</button>
  <button class="btn" id="saveBtn">💾 保存</button>
  <button class="btn" id="savesBtn">📂 存档</button>
  <button class="btn" id="dlBtn">⬇ 下载</button>
  <button class="btn primary" id="exportBtn">✨ 发给 Claude 渲染</button>
</header>

<main>
  <section class="panel stage-wrap">
    <div class="stage" id="stage">
      <div class="layer full" id="fullLayer"></div>
      <div class="layer phonebg" id="phoneLayer" style="display:none"><div class="phone" id="phone"></div></div>
      <div class="layer" id="safeLayer">
        <div class="safe" style="left:0;right:0;top:0;height:11.5%"></div>
        <div class="safe" style="left:0;right:0;bottom:0;height:21%"></div>
        <div class="safe" style="right:0;width:13%;top:45%;height:34%"></div>
      </div>
      <div class="layer" id="textLayer"></div>
      <div class="guide" id="guide"></div>
      <div class="hguide" id="hguide"></div>
    </div>
    <div class="transport">
      <button class="btn" id="restartBtn">⏮</button>
      <button class="btn primary" id="playBtn" style="min-width:84px">▶ 播放</button>
      <span class="time" id="timeLbl">0.0 / 0.0s</span>
      <button class="btn" id="soundBtn">🔇 静音</button>
    </div>
    <div class="inline" style="justify-content:center">
      <label class="chk"><input type="checkbox" id="safeChk"> 显示 IG 遮挡区</label>
    </div>
    <div class="hint" style="text-align:center">点文字选中 → 拖动可移到任何位置；黄色圆点：转角度 / 放大缩小<br>拖动文字以外的地方 = 移动影片画面</div>
  </section>

  <section class="panel" id="inspectorPanel">
    <div class="tabs">
      <button class="tab" data-tab="seg">🎞 片段</button>
      <button class="tab" data-tab="text">🔤 文字</button>
      <button class="tab" data-tab="audio">🎵 声音</button>
    </div>
    <div id="inspector"></div>
  </section>

  <section class="panel timeline-wrap">
    <div class="inline" style="justify-content:space-between;margin-bottom:6px">
      <h2>时间轴</h2>
      <div class="inline"><span class="hint">缩放</span><input type="range" id="zoom" min="1" max="8" step="0.5" value="1" style="width:110px;flex:none"></div>
    </div>
    <div class="tl-scroll" id="tlScroll"><div class="tl" id="tl"></div></div>
    <div class="hint" style="margin-top:4px">拖片段两边的<b>紫色把手</b>改长度；声音块可以左右拖。</div>
    <div class="tl-actions">
      <button class="btn small" id="leftBtn">◀ 往前移</button>
      <button class="btn small" id="rightBtn">往后移 ▶</button>
      <button class="btn small" id="splitBtn">✂ 在播放头切开</button>
      <button class="btn small" id="dupBtn">⧉ 复制</button>
      <button class="btn small" id="delBtn">🗑 删除</button>
      <button class="btn small" id="addBtn">＋ 新片段</button>
      <span class="spacer"></span>
      <label class="chk"><input type="checkbox" id="badgeOn"> 角标</label>
      <input type="text" id="badgeText" style="width:160px">
    </div>
  </section>
</main>

<div class="modal" id="modal">
  <div class="box">
    <h2>发给 Claude 渲染</h2>
    <p id="modalMsg"></p>
    <div id="fileList"></div>
    <details id="copyBox"><summary class="hint">备用：手动复制设定</summary>
      <textarea id="exportText" readonly></textarea>
      <button class="btn small" id="copyAgain" style="margin-top:6px">复制</button>
    </details>
    <div class="inline" style="justify-content:flex-end;margin-top:10px">
      <button class="btn primary" id="closeModal">好</button>
    </div>
  </div>
</div>
<div class="modal" id="savesModal">
  <div class="box">
    <h2>📂 存档</h2>
    <p class="hint">点"打开"就会回到那个版本（现在的内容可以用"撤销"找回）。</p>
    <div class="savelist" id="saveList"></div>
    <div class="inline" style="justify-content:flex-end"><button class="btn primary" data-close="savesModal">关闭</button></div>
  </div>
</div>
<div class="modal" id="dlModal">
  <div class="box">
    <h2>⬇ 下载</h2>
    <div class="dlrow">
      <b>🎬 成品影片（MP4）</b>
      <p class="hint" id="renderInfo">检查中…</p>
      <button class="btn primary" id="dlVideo" disabled>下载成品</button>
    </div>
    <div class="dlrow">
      <b>🗂 项目备份（JSON）</b>
      <p class="hint">现在工作室里的全部设定，可以留着备份，或者拿到别的账号用。</p>
      <button class="btn" id="dlProject">下载备份</button>
    </div>
    <p class="hint" id="dlNote"></p>
    <div class="inline" style="justify-content:flex-end"><button class="btn primary" data-close="dlModal">关闭</button></div>
  </div>
</div>
<div class="toast" id="toast"></div>

<script>
const FONTS = __FONTS__;
const DEFAULT = __PROJECT__;
const STORE_KEY = 'olivia-studio-v2-keyboard';
const LH = 1.11;
const $ = id => document.getElementById(id);
const clone = o => JSON.parse(JSON.stringify(o));
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
const r2 = v => Math.round(v * 100) / 100;
const uid = p => (p || 'x') + Math.random().toString(36).slice(2, 8);

/* fonts */
$('fontfaces').textContent = Object.entries(FONTS).map(([k, f]) => `@font-face{font-family:"F-${k}";src:url("${f.file}");font-weight:normal;font-style:normal;font-display:block}`).join('\n');
Object.keys(FONTS).forEach(k => { try { document.fonts.load(`40px "F-${k}"`); } catch (e) {} });

/* state */
let project = clone(DEFAULT);
let meta = { editedAt: 0, savedAt: 0 };
try {
  const s = localStorage.getItem(STORE_KEY);
  if (s) { const o = JSON.parse(s); const p = o && o.p ? o.p : o; if (p && p.segments && p.version === 2) project = p; if (o && o.meta) meta = o.meta; }
} catch (e) {}
project.audio = project.audio || []; project.styles = project.styles || clone(DEFAULT.styles); project.mix = project.mix || { videoVolume: 1 };
let history = [], selSeg = 0, selText = -1, selAudio = -1, tab = 'seg';
let playing = false, gTime = 0, lastTick = 0, muted = true, interacting = false;

const segDur = s => s.freeze ? (s.out - s.in) : (s.out - s.in) / (s.speed || 1);
const total = () => project.segments.reduce((a, s) => a + segDur(s), 0);
const segStart = i => project.segments.slice(0, i).reduce((a, s) => a + segDur(s), 0);
const clipDur = c => Math.max(0.05, c.out - c.in);
function segAt(t) {
  let acc = 0;
  for (let i = 0; i < project.segments.length; i++) {
    const d = segDur(project.segments[i]);
    if (t < acc + d || i === project.segments.length - 1) return { i, local: clamp(t - acc, 0, d) };
    acc += d;
  }
  return { i: 0, local: 0 };
}
function writeLocal() { try { localStorage.setItem(STORE_KEY, JSON.stringify({ p: project, meta })); } catch (e) {} }
function save() { meta.editedAt = Date.now(); writeLocal(); markDirty(); }
function markDirty() { const d = meta.editedAt > meta.savedAt; const b = $('saveBtn'); if (b) b.innerHTML = d ? '💾 保存<span class="dirty-dot" title="有未保存的修改"></span>' : '💾 已保存'; }
function commit() { history.push(JSON.stringify(project)); if (history.length > 80) history.shift(); $('undoBtn').disabled = false; }
function toast(m) { const t = $('toast'); t.textContent = m; t.classList.add('on'); clearTimeout(t._h); t._h = setTimeout(() => t.classList.remove('on'), 1900); }
function refresh(full) { save(); renderTimeline(); markStage(); if (full) renderInspector(); applyFrame(true); }

/* ---------- video sources ---------- */
const videos = {};
for (const [k, src] of Object.entries(project.sources)) {
  const v = document.createElement('video');
  v.src = src.file; v.preload = 'auto'; v.muted = true; v.playsInline = true; v.setAttribute('playsinline', ''); v.style.display = 'none';
  videos[k] = v; $('fullLayer').appendChild(v);
}
let activeKey = null, activeIdx = -1;
const S = () => $('stage').clientWidth / 1080;
function activate(i) {
  const seg = project.segments[i], v = videos[seg.src];
  if (activeKey && activeKey !== seg.src) { videos[activeKey].pause(); videos[activeKey].style.display = 'none'; }
  const phone = seg.layout === 'phone';
  const target = phone ? $('phone') : $('fullLayer');
  if (v.parentNode !== target) target.appendChild(v);
  v.style.display = 'block';
  $('phoneLayer').style.display = phone ? 'block' : 'none';
  $('fullLayer').style.display = phone ? 'none' : 'block';
  activeKey = seg.src; activeIdx = i;
  positionVideo(seg);
}
/* geometry shared with the renderer (canvas units, 1080x1920) */
function videoBox(seg) {
  const vs = seg.vs || 1, vx = seg.vx || 0, vy = seg.vy || 0;
  if (seg.layout === 'phone') {
    const w = 1000 * vs, h = (seg.ph || 1400) * vs;
    return { x: 540 - w / 2 + vx, y: 1080 - h / 2 + vy, w, h, r: 48 * vs, cy: (seg.cropY || 0) * vs };
  }
  const w = 1080 * vs, h = 1920 * vs;
  return { x: 540 - w / 2 + vx, y: 960 - h / 2 + vy, w, h };
}
function positionVideo(seg) {
  const v = videos[seg.src], s = S(), b = videoBox(seg);
  if (seg.layout === 'phone') {
    Object.assign($('phone').style, { left: b.x * s + 'px', top: b.y * s + 'px', width: b.w * s + 'px', height: b.h * s + 'px', borderRadius: b.r * s + 'px' });
    Object.assign(v.style, { position: 'absolute', left: '0', width: b.w * s + 'px', height: 'auto', top: -b.cy * s + 'px' });
  } else {
    $('fullLayer').className = 'layer full ' + (seg.bgc === 'lav' ? 'lav' : 'black');
    Object.assign(v.style, { position: 'absolute', left: b.x * s + 'px', top: b.y * s + 'px', width: b.w * s + 'px', height: b.h * s + 'px' });
  }
}

/* ---------- audio clips ---------- */
const audioEls = {}; // clip.id -> {el, url}
const fileStore = {}; // fileKey -> blob url
let idb = null;
try {
  const req = indexedDB.open('olivia-studio-files', 1);
  req.onupgradeneeded = () => req.result.createObjectStore('files');
  req.onsuccess = () => { idb = req.result; project.audio.forEach(c => loadBlob(c)); };
} catch (e) {}
function storeBlob(key, blob) { try { if (idb) idb.transaction('files', 'readwrite').objectStore('files').put(blob, key); } catch (e) {} }
function loadBlob(c) {
  if (fileStore[c.fileKey]) return attachAudio(c);
  try {
    if (!idb) return;
    const r = idb.transaction('files').objectStore('files').get(c.fileKey);
    r.onsuccess = () => { if (r.result) { fileStore[c.fileKey] = URL.createObjectURL(r.result); attachAudio(c); renderTimeline(); if (tab === 'audio') renderInspector(); } };
  } catch (e) {}
}
function attachAudio(c) {
  const url = fileStore[c.fileKey]; if (!url) return;
  if (audioEls[c.id] && audioEls[c.id].url === url) return;
  const el = new Audio(url); el.preload = 'auto';
  audioEls[c.id] = { el, url };
}
const hasFile = c => !!fileStore[c.fileKey];
function addAudioFile(file, kind) {
  const url = URL.createObjectURL(file);
  const probe = document.createElement(file.type.startsWith('video') ? 'video' : 'audio');
  probe.preload = 'metadata'; probe.src = url;
  probe.onloadedmetadata = () => {
    const d = isFinite(probe.duration) ? probe.duration : 10;
    commit();
    const key = file.name + '|' + file.size;
    fileStore[key] = url; storeBlob(key, file);
    const c = { id: uid('a'), kind, name: file.name, fileKey: key, fileDur: r2(d), start: kind === 'music' ? 0 : r2(Math.min(gTime, Math.max(0, total() - 1))), in: 0, out: r2(kind === 'music' ? Math.min(d, total()) : d), volume: kind === 'music' ? 0.6 : 1, fadeIn: kind === 'music' ? 0.5 : 0, fadeOut: kind === 'music' ? 1 : 0, duck: kind === 'music', mute: false };

const PROJECT_DOC = 'projects/keyboard', SAVES = 'projects/keyboard/saves';
let DB = null, DL = null, saving = false;
const fmtTime = ts => { const d = new Date(ts); return `${d.getMonth() + 1}/${d.getDate()} ${String(d.getHours()).padStart(2, '0')}:${String(d.getMinutes()).padStart(2, '0')}`; };
const withTimeout = (p, ms) => Promise.race([p, new Promise((_, rej) => setTimeout(() => rej({ code: 'timeout' }), ms))]);
async function cloudSave(label) {
  if (saving) return false;
  saving = true;
  const now = Date.now();
  const body = { json: JSON.stringify(project), savedAt: now, label: label || '手动保存', total: r2(total()) };
  try {
    if (!DB) throw { code: 'no_db' };
    await withTimeout(DB.doc(PROJECT_DOC).set(body), 15000);
    try {
      await DB.collection(SAVES).add(body);
      const all = await DB.collection(SAVES).orderBy('savedAt', 'desc').get();
      for (const d of all.docs.slice(15)) { try { await DB.collection(SAVES).doc(d.id).delete(); } catch (e) {} }
    } catch (e) {}
    meta.savedAt = now; if (meta.editedAt > now) meta.editedAt = now; writeLocal(); markDirty();
    saving = false; return true;
  } catch (e) {
    saving = false;
    meta.savedAt = now; writeLocal(); markDirty();
    toast(e && e.code === 'no_db' ? '这里不能云端保存，已先存在这台设备上' : '云端保存失败，已先存在这台设备上，稍后再按一次');
    return false;
  }
}

    if (snap.empty) { list.innerHTML = '<p class="hint">还没有存档，按"💾 保存"就会出现在这里。</p>'; return; }
    list.innerHTML = '';
    snap.docs.forEach(d => {
